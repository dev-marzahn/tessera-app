# Builds and publishes a release when a vX.Y.Z tag is pushed: the signed, R8-minified APK and its R8 mapping on
# Ubuntu, the ad-hoc-signed DMG on macOS, both attested with build provenance, in one GitHub release named
# "Tessera <version>" whose body is the version's CHANGELOG.md section. The APK job uses the `release` environment,
# whose signing secrets only v* tags get, after the owner approves the run.
#
# The builds run the same Gradle tasks as `./gradlew release` (releaseApk and releaseMac), which read the signing
# settings as Gradle properties; here the APK's come from TESSERA_SIGNING_* environment variables, which the build reads
# when the properties aren't set. Not ORG_GRADLE_PROJECT_tessera.signing.*: gradlew runs under /bin/sh, and Ubuntu's
# dash drops variables with dots in their names. Every action is pinned to a commit, with its release in a comment.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Before any build or approval: the tag must be the catalog's version, and CHANGELOG.md must have its section.
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the version catalog
        id: version
        run: |
          # Not echoed until it's checked: a tag name can't inject a workflow command.
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The tag isn't vX.Y.Z"; exit 1; }
          version=${GITHUB_REF_NAME#v}
          catalog=$(sed -n 's/^tessera = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          [ "$catalog" = "$version" ] ||
            { echo "::error::$GITHUB_REF_NAME doesn't match the tessera version in gradle/libs.versions.toml ($catalog)"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/release-notes.sh "$VERSION" "$GITHUB_REPOSITORY" >"$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  apk:
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      # Readable only by the runner's user, and removed by the last step whatever happens.
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TESSERA_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::The release environment has no TESSERA_KEYSTORE_BASE64"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode >"$RUNNER_TEMP/release.jks"
      # The runner has the Android SDK at ANDROID_HOME. Without the configuration cache, which would store the
      # passwords on disk. A secret the environment lacks is an empty variable, and releaseApk names it.
      - name: Build the APK
        env:
          TESSERA_SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          TESSERA_SIGNING_STORE_PASSWORD: ${{ secrets.TESSERA_STORE_PASSWORD }}
          TESSERA_SIGNING_KEY_ALIAS: ${{ secrets.TESSERA_KEY_ALIAS }}
          TESSERA_SIGNING_KEY_PASSWORD: ${{ secrets.TESSERA_KEY_PASSWORD }}
        run: >-
          ./gradlew releaseApk --no-daemon --no-configuration-cache --stacktrace
          -Pkotlin.compiler.execution.strategy=in-process
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: |
            build/release/Tessera-${{ needs.notes.outputs.version }}.apk
            build/release/Tessera-${{ needs.notes.outputs.version }}-mapping.txt
          if-no-files-found: error

  # No Mac signing settings: the app inside is ad-hoc signed, and the DMG isn't notarized (the notes say so).
  dmg:
    needs: notes
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - name: Build the DMG
        run: >-
          ./gradlew releaseMac --no-daemon --stacktrace
          -Pkotlin.compiler.execution.strategy=in-process
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: build/release/Tessera-${{ needs.notes.outputs.version }}.dmg
          if-no-files-found: error

  publish:
    needs: [notes, apk, dmg]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release
      id-token: write # the attestations' signing certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Tessera-${{ needs.notes.outputs.version }}.apk
            dist/Tessera-${{ needs.notes.outputs.version }}.dmg
      # Never a pre-release, so Obtainium offers it, and the latest release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.notes.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Tessera $VERSION" --notes-file dist/notes.md \
            "dist/Tessera-$VERSION.apk" "dist/Tessera-$VERSION.dmg" "dist/Tessera-$VERSION-mapping.txt"
